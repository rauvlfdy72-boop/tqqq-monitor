name: Update and deploy monitor
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'
permissions:
  contents: read
concurrency:
  group: tqqq-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate strategy
        run: npm test
      - name: Download and validate latest closes
        run: npm run refresh
      - name: Keep an audit of the published data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified daily market data'
            git push
          fi
      - name: Build standalone static site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
